[package]
name = "lilith-artbank"
version = "0.1.0"
description = "Large-scale local art asset library"
authors = ["ACSProgram"]
edition = "2024"
publish = false

[lib]
name = "lilith_artbank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 无窗口验收入口：仅供开发期测试以独立进程调用真实可执行文件。
# 不改变依赖特性，不进发布产物，因此不加入 default。
[features]
headless = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
half = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "tiff", "webp"] }
memmap2 = "0.9"
log = "0.4"
parking_lot = "0.12"
rayon = "1"
rmcp = { version = "3.7", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
webp = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# 导入、缩放和 SQLite 在未优化构建下会慢一个数量级；只在开发档提升依赖优化，
# 保持本 crate 的增量编译速度。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
